# Автозапуск API-тестов на GitHub при каждом push и pull request
name: API tests

on:
  push:
    branches: [ main, homework-1 ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать код репозитория
        uses: actions/checkout@v4

      - name: Установить Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '24'

      - name: Настроить Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Запустить тесты
        run: |
          chmod +x gradlew
          ./gradlew test

      - name: Сохранить HTML-отчёт о тестах
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
